# Configuración de conexión a la base de datos MySQL
# IMPORTANTE: la aplicación se conecta con el usuario "bodega_app" (SELECT/INSERT/
# UPDATE/DELETE únicamente, sin DDL). Nunca usar aquí el usuario root ni bodega_dba.
# Ver la sección "SEGURIDAD: usuarios y privilegios mínimos" al final de schema.sql.
db.url=jdbc:mysql://localhost:3306/bodega_db?useSSL=false&allowPublicKeyRetrieval=true
db.username=bodega_app
db.password=App_Bodega_2026#Xk9

# Configuración del pool HikariCP
# Valores reducidos respecto al original: MySQL y Tomcat comparten el mismo EC2 t3.micro
# (1 GB de RAM total) y el uso esperado es de un grupo pequeño sin conexión simultánea alta.
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# Clave de cifrado de aplicación (AES-256-GCM, Base64 de 32 bytes) usada por
# com.bodega.util.CifradoUtil para cifrar columnas sensibles (ej. clientes.direccion).
# En un entorno productivo real esta clave NO debe vivir en este archivo: debe
# inyectarse por variable de entorno o gestor de secretos. Rotarla invalida todo
# dato ya cifrado con la clave anterior (habría que re-cifrar antes de rotar).
app.encryption.key=PiyJ/TZDERAeb4koMFk9mok/ATYZMNa7xqAOvA068qE=

# Respaldos automáticos de base de datos (ver com.bodega.service.BackupService y
# com.bodega.scheduler.BackupScheduler). Usuario dedicado de solo lectura para el
# respaldo (SELECT/LOCK TABLES/SHOW VIEW/EVENT/TRIGGER), nunca el de la aplicación.
db.backup.username=bodega_backup
db.backup.password=Bkp_Bodega_2026#Rt3
db.backup.mysqldump.path=/usr/bin/mysqldump
db.backup.dir=/opt/tomcat/bodega_backups
db.backup.retencion.dias=30
# Hora del día (0-23, hora local del servidor) en la que corre el respaldo automático.
db.backup.hora=2

# Configuración SMTP para las notificaciones por correo del módulo de Órdenes de Compra
# (creación, aprobación, rechazo) y el envío del comprobante de venta al cliente. Ver
# com.bodega.service.EmailService. mail.smtp.password es una "Contraseña de aplicación"
# de Gmail (no la contraseña real de la cuenta), generada desde la configuración de
# seguridad de la cuenta de Google — se escribe sin espacios.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.username=tambitobodega@gmail.com
mail.smtp.password=pwzdoryjwempzyil
mail.from=tambitobodega@gmail.com

# Hora del día (0-23, hora local del servidor) en la que corre el resumen diario de alertas
# de inventario por correo (stock bajo, lotes por vencer, baja rotación). Ver
# com.bodega.scheduler.AlertaEmailScheduler.
alertas.email.hora=7

